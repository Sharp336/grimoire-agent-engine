syntax = "proto3";

package aiserver.v1;

// Minimal, unknown-field-tolerant description of Cursor's HTTP/1 streaming
// bridge RPCs. Only the fields consumed by omp's transport are declared; every
// other vendor field is ignored by proto3 decoding. Field numbers and types
// are pinned to the vendor wire contract recovered from the installed CLI:
// BidiRequestId {request_id=1,string}
// BidiAppendRequest {data=1,string, request_id=2,BidiRequestId, append_seqno=3,uint64, data_binary=4,bytes}
// BidiPollRequest {request_id=1,BidiRequestId, start_request=2,bool}
// BidiPollResponse {seqno=1,uint64, data=2,string, eof=3,bool}

// Identifies one logical bidi request across the append/poll/SSE channels.
message BidiRequestId {
  string request_id = 1;
}

// Appends a client frame (AgentClientMessage bytes) to an open bidi request.
message BidiAppendRequest {
  // Legacy JSON-encoded payload slot (unused by omp; kept for wire parity).
  string data = 1;
  BidiRequestId request_id = 2;
  // Monotonic per-request sequence number for FIFO ordering on the server.
  uint64 append_seqno = 3;
  // Binary AgentClientMessage frame.
  bytes data_binary = 4;
}

// Response to a BidiAppend call. No fields are consumed by omp.
message BidiAppendResponse {}

// Polls buffered server frames for a bidi request (HTTP/1 receive fallback).
message BidiPollRequest {
  BidiRequestId request_id = 1;
  // When true, (re)starts the server stream for this request id.
  bool start_request = 2;
}

// One polled server frame.
message BidiPollResponse {
  uint64 seqno = 1;
  // Server frame data (string in vendor wire, not bytes).
  string data = 2;
  bool eof = 3;
}

// Client->server frame append. Server frames are consumed via the
// AgentService.RunSSE / RunPoll server-streaming methods (declared in the
// hand-corrected transport descriptors), not through this service.
service BidiService {
  rpc BidiAppend(BidiAppendRequest) returns (BidiAppendResponse);
}
