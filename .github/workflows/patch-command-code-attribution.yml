name: Temporary Command Code attribution patch

on:
  push:
    branches:
      - feat/command-code-provider-api

permissions:
  contents: write

jobs:
  patch-attribution:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/command-code-provider-api
          fetch-depth: 0

      - name: Add external contributor attribution
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("packages/ai/CHANGELOG.md"): (
                  "- Added Command Code API-key login with authenticated Provider API model validation and mixed-wire request routing.",
                  "- Added Command Code API-key login with authenticated Provider API model validation and mixed-wire request routing ([#9564](https://github.com/can1357/oh-my-pi/pull/9564) by [@himomohi](https://github.com/himomohi)).",
              ),
              Path("packages/catalog/CHANGELOG.md"): (
                  "- Added Command Code as a mixed-wire provider with authenticated model discovery and per-model Anthropic Messages/OpenAI Chat Completions routing.",
                  "- Added Command Code as a mixed-wire provider with authenticated model discovery and per-model Anthropic Messages/OpenAI Chat Completions routing ([#9564](https://github.com/can1357/oh-my-pi/pull/9564) by [@himomohi](https://github.com/himomohi)).",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if new in text:
                  print(f"{path}: attribution already present")
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one target line in {path}; found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"{path}: attribution added")

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-command-code-attribution.yml
          git diff --check
          git diff -- packages/ai/CHANGELOG.md packages/catalog/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/CHANGELOG.md packages/catalog/CHANGELOG.md
          git commit -m "docs: attribute Command Code changelog entries"
          git push origin HEAD:feat/command-code-provider-api
