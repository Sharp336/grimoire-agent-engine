name: Fork Format Temp

on:
  push:
    branches: [hub-model-surface]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: hub-model-surface

      - uses: ./.github/actions/bun-install

      - name: Format fork source changes
        shell: bash
        run: |
          set -euo pipefail
          bunx biome format --write \
            packages/coding-agent/src/tools/hub/index.ts \
            packages/coding-agent/src/tools/hub/jobs.ts \
            packages/coding-agent/test/tools/hub-model-surface.test.ts

          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/coding-agent/src/tools/hub/index.ts \
            packages/coding-agent/src/tools/hub/jobs.ts \
            packages/coding-agent/test/tools/hub-model-surface.test.ts
          git commit -m "style: format fork Hub changes"
          git push origin HEAD:hub-model-surface
