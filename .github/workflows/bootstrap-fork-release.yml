name: Bootstrap exact native pin in ordinary CI

on:
  push:
    branches: [optimize-fork-release-pipeline]
    paths:
      - .github/workflows/bootstrap-fork-release.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-fork-release.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: optimize-fork-release-pipeline
          fetch-depth: 0

      - name: Generate the exact-version ordinary CI file
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/ci.yml')
          output = Path('.github/ci.yml.generated')
          text = source.read_text()
          replacements = {
              "fetch the latest release's Linux x64 pair": "fetch the matching 17.4.0 Linux x64 pair",
              "# ---- PR path: latest release addons from npm ----": "# ---- PR path: matching release addons from npm ----",
              "@oh-my-pi/pi-natives-linux-x64@latest dist.tarball": "@oh-my-pi/pi-natives-linux-x64@17.4.0 dist.tarball",
              "PR CI tests against the latest release addons by design": "PR CI tests against the matching 17.4.0 release addons by design",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          if '@oh-my-pi/pi-natives-linux-x64@latest' in text:
              raise SystemExit('latest native package reference remains in generated CI')
          output.write_text(text)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/ci.yml.generated
          git diff --cached --check
          git commit -m "ci: generate exact-version ordinary CI"
          git push origin HEAD:optimize-fork-release-pipeline
