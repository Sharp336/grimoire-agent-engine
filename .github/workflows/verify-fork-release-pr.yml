name: Verify fork release PR

on:
  pull_request:
    branches: [main]
    paths:
      - .github/fork-release-native-manifest.json
      - .github/scripts/fork-release-native.sh
      - .github/workflows/fork-release.yml
      - .github/workflows/verify-fork-release-pr.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: optimize-fork-release-pipeline

      - name: Validate workflow and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/fork-release-native.sh
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/fork-release.yml

      - name: Assert the two-install release architecture
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/fork-release.yml
          test "$(grep -c 'uses: ./.github/actions/bun-install' "$workflow")" -eq 2
          grep -q 'RELEASE_TARGETS: linux-x64,win32-x64' "$workflow"
          grep -q 'runs-on: ubuntu-24.04-arm' "$workflow"
          grep -q 'retention-days: 1' "$workflow"
          if grep -qE 'pi-natives-(linux-x64|linux-arm64|win32-x64)@latest' .github/workflows/*.yml; then
            echo '::error::floating native package reference found'
            exit 1
          fi

      - name: Download and verify all locked native packages
        shell: bash
        run: |
          set -euo pipefail
          for target in linux-x64 linux-arm64 win32-x64; do
            bash .github/scripts/fork-release-native.sh "$target" "$RUNNER_TEMP/native-$target"
          done

      - name: Generate coherent release and installer files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          generated = Path('.github/generated')
          generated.mkdir(parents=True, exist_ok=True)

          release = Path('.github/workflows/fork-release.yml').read_text()
          if release.count('-f make_latest=false') != 2:
              raise SystemExit('expected two make_latest=false release API fields')
          release = release.replace('-f make_latest=false', '-f make_latest=true')
          (generated / 'fork-release.yml').write_text(release)

          install_path = Path('scripts/install.sh')
          install_sh = install_path.read_text().replace(
              'https://raw.githubusercontent.com/can1357/oh-my-pi/main/scripts/install.sh',
              'https://raw.githubusercontent.com/jchanghong023/oh-my-pi/main/scripts/install.sh',
          )
          lines = install_sh.splitlines()

          os_start = lines.index('    case "$OS" in')
          expected_os = [
              '    case "$OS" in',
              '        Linux)  PLATFORM="linux" ;;',
              '        Darwin) PLATFORM="darwin" ;;',
              '        *)      echo "Unsupported OS: $OS"; exit 1 ;;',
              '    esac',
          ]
          if lines[os_start:os_start + len(expected_os)] != expected_os:
              raise SystemExit('install.sh OS block changed unexpectedly')
          lines[os_start:os_start + len(expected_os)] = [
              '    case "$OS" in',
              '        Linux) PLATFORM="linux" ;;',
              '        Darwin)',
              '            echo "This fork does not publish macOS binaries. Re-run with --source to install from the fork repository."',
              '            exit 1',
              '            ;;',
              '        *) echo "Unsupported OS: $OS"; exit 1 ;;',
              '    esac',
          ]

          musl_start = lines.index('    if [ "$PLATFORM" = "linux" ]; then')
          expected_musl = [
              '    if [ "$PLATFORM" = "linux" ]; then',
              '        if [ -f /etc/alpine-release ] || { command -v ldd >/dev/null 2>&1 && ldd --version 2>&1 | grep -qi musl; }; then',
              '            PLATFORM="linux-musl"',
              '        fi',
              '    fi',
          ]
          if lines[musl_start:musl_start + len(expected_musl)] != expected_musl:
              raise SystemExit('install.sh musl block changed unexpectedly')
          lines[musl_start:musl_start + len(expected_musl)] = [
              '    if [ -f /etc/alpine-release ] || { command -v ldd >/dev/null 2>&1 && ldd --version 2>&1 | grep -qi musl; }; then',
              '        echo "This fork publishes glibc Linux binaries only; musl users should re-run with --source."',
              '        exit 1',
              '    fi',
          ]

          main_logic = lines.index('# Main logic')
          source_index = lines.index('    source)', main_logic)
          if lines[source_index + 1] != '        if ! has_bun; then':
              raise SystemExit('install.sh source branch changed unexpectedly')
          lines[source_index + 1:source_index + 1] = [
              '        if [ -z "$REF" ]; then',
              '            REF="main"',
              '        fi',
          ]
          install_sh = '\n'.join(lines) + '\n'
          if 'PLATFORM="darwin"' in install_sh or 'PLATFORM="linux-musl"' in install_sh:
              raise SystemExit('unsupported binary platform remains in install.sh')
          (generated / 'install.sh').write_text(install_sh)

          ps_path = Path('scripts/install.ps1')
          install_ps1 = ps_path.read_text().replace(
              'https://raw.githubusercontent.com/can1357/oh-my-pi/main/scripts/install.ps1',
              'https://raw.githubusercontent.com/jchanghong023/oh-my-pi/main/scripts/install.ps1',
          )
          ps_lines = install_ps1.splitlines()
          ps_source = ps_lines.index('if ($Source) {')
          if ps_lines[ps_source + 1] != '    if (-not (Test-BunInstalled)) {':
              raise SystemExit('install.ps1 source branch changed unexpectedly')
          ps_lines[ps_source + 1:ps_source + 1] = [
              '    if (-not $Ref) {',
              '        $Ref = "main"',
              '    }',
          ]
          (generated / 'install.ps1').write_text('\n'.join(ps_lines) + '\n')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/generated
          git commit -m "ci: stage coherent release installer files"
          git push origin HEAD:optimize-fork-release-pipeline
