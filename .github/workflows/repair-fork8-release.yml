name: Repair fork.8 Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-fork8-release.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  repair:
    name: Repair v17.4.0-fork.8 assets
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download successful build artifacts from run 32467967353
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32467967353
          pattern: omp-binaries-*
          path: release
          merge-multiple: true

      - name: Verify binaries and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' omp-linux-arm64 omp-linux-x64 omp-windows-x64.exe | sort > "$expected"
          find release -maxdepth 1 -type f -printf '%f\n' | sort > "$actual"
          diff -u "$expected" "$actual"
          file release/omp-linux-x64 | grep -q 'ELF 64-bit LSB executable, x86-64'
          file release/omp-linux-arm64 | grep -q 'ELF 64-bit LSB executable, ARM aarch64'
          file release/omp-windows-x64.exe | grep -q 'PE32+ executable.*x86-64'
          (
            cd release
            sha256sum omp-linux-x64 omp-linux-arm64 omp-windows-x64.exe > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Replace Release assets through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v17.4.0-fork.8
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          release_id="$(jq -r '.id' "$release_json")"

          assets_json="$RUNNER_TEMP/assets-before.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$assets_json"
          jq -r '.[].id' "$assets_json" | while read -r asset_id; do
            [ -z "$asset_id" ] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
          done

          for file in \
            release/omp-linux-x64 \
            release/omp-linux-arm64 \
            release/omp-windows-x64.exe \
            release/SHA256SUMS.txt; do
            asset="$(basename "$file")"
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset}" \
              >/dev/null
            echo "Uploaded ${asset}"
          done

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f name='OMP 17.4.0 fork build 8' \
            -f body='Fork build from successful Actions run 32467967353. Custom assets: Linux x64, Linux ARM64, Windows x64, and SHA256SUMS.txt. GitHub also shows two automatic Source code archives; those are not build artifacts.' \
            -F draft=false \
            -F prerelease=false >/dev/null

          final_json="$RUNNER_TEMP/assets-final.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$final_json"
          jq -r '.[].name' "$final_json" | sort > "$RUNNER_TEMP/final-names.txt"
          printf '%s\n' SHA256SUMS.txt omp-linux-arm64 omp-linux-x64 omp-windows-x64.exe | sort > "$RUNNER_TEMP/expected-names.txt"
          diff -u "$RUNNER_TEMP/expected-names.txt" "$RUNNER_TEMP/final-names.txt"
          if jq -e 'any(.[]; (.size // 0) <= 0)' "$final_json" >/dev/null; then
            echo '::error::A release asset has zero size'
            exit 1
          fi
          echo 'Release v17.4.0-fork.8 now has exactly four non-empty custom assets.'

  record:
    name: Record repair result
    needs: repair
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Write repair status to main
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.repair.result }}
        shell: bash
        run: |
          set -euo pipefail
          status_path='.github/repair-fork8-status.json'
          body="$(jq -n --argjson run_id "$GITHUB_RUN_ID" --arg result "$RESULT" --arg sha "$GITHUB_SHA" '{run_id:$run_id,result:$result,sha:$sha}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          old_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${status_path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${status_path}" -f message="ci: record fork.8 repair ${GITHUB_RUN_ID}" -f content="$encoded" -f branch=main)
          if [ -n "$old_sha" ] && [[ "$old_sha" != *'Not Found'* ]]; then
            args+=(-f sha="$old_sha")
          fi
          gh api "${args[@]}" >/dev/null
