name: Fork Release

on:
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Prepare fork release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Fork releases must be dispatched from main, not $GITHUB_REF"
            exit 1
          fi

          version="$(node -p "require('./packages/coding-agent/package.json').version")"
          release_tag="v${version}-fork.${GITHUB_RUN_NUMBER}"

          {
            echo "version=$version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Fork release: ${release_tag}"

  build-x64:
    name: Build Linux + Windows x64
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Build Linux and Windows x64 native addons
        uses: ./.github/actions/bazel-natives
        with:
          targets: linux-x64-baseline linux-x64-modern win32-x64-baseline
          cache-scope: fork-release-x64

      - name: Build both x64 targets with one shared bundle
        env:
          RELEASE_TARGETS: linux-x64,win32-x64
          OMP_FORK_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: bun run ci:release:build-binaries

      - name: Verify and smoke-test Linux x64
        shell: bash
        run: |
          set -euo pipefail
          linux_binary="$PWD/packages/coding-agent/binaries/omp-linux-x64"
          windows_binary="$PWD/packages/coding-agent/binaries/omp-windows-x64.exe"
          test -s "$linux_binary"
          test -s "$windows_binary"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$linux_binary" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$linux_binary" --smoke-test

      - name: Upload x64 binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-binaries-x64
          path: |
            packages/coding-agent/binaries/omp-linux-x64
            packages/coding-agent/binaries/omp-windows-x64.exe
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: Build Linux ARM64
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Build Linux ARM64 native addon
        uses: ./.github/actions/bazel-natives
        with:
          targets: linux-arm64
          cache-scope: fork-release-arm64

      - name: Build Linux ARM64 target
        env:
          RELEASE_TARGETS: linux-arm64
          OMP_FORK_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: bun run ci:release:build-binaries

      - name: Verify on a real ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          binary="$PWD/packages/coding-agent/binaries/omp-linux-arm64"
          test -s "$binary"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --smoke-test

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-binaries-arm64
          path: packages/coding-agent/binaries/omp-linux-arm64
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish fork release
    needs: [validate, build-x64, build-arm64]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: omp-binaries-*
          path: release
          merge-multiple: true

      - name: Verify exact asset set
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-assets.txt"
          actual="$RUNNER_TEMP/actual-assets.txt"
          printf '%s\n' \
            omp-linux-arm64 \
            omp-linux-x64 \
            omp-windows-x64.exe | sort > "$expected"
          find release -maxdepth 1 -type f -printf '%f\n' | sort > "$actual"
          if ! diff -u "$expected" "$actual"; then
            echo "::error::Release artifact set is not exactly the three supported binaries"
            exit 1
          fi
          for file in omp-linux-x64 omp-linux-arm64 omp-windows-x64.exe; do
            test -s "release/$file"
          done

      - name: Create or verify release tag through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Existing tag ${RELEASE_TAG} points to ${existing_sha}, not ${GITHUB_SHA}"
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already points to the expected commit."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Publish GitHub release and assets through the API
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Downstream fork package built from the current main branch.

          Assets are intentionally limited to Linux x64, Linux ARM64, and Windows x64. All native addons are built from this fork's checked-out sources during this workflow run.

          The fork defaults \`hub.mode\` to \`compact\`; set it to \`full\` to restore the upstream Hub model surface without rebuilding. The upstream Hub/IRC runtime remains intact.
          EOF
          title="OMP ${VERSION} fork build ${GITHUB_RUN_NUMBER}"

          if release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null)"; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="$title" \
              -f body="$(cat "$notes")" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true >/dev/null
          else
            release_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$title" \
              -f body="$(cat "$notes")" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true \
              --jq '.id')"
          fi

          assets_json="$RUNNER_TEMP/release-assets.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$assets_json"

          for file in \
            release/omp-linux-x64 \
            release/omp-linux-arm64 \
            release/omp-windows-x64.exe; do
            asset="$(basename "$file")"
            existing_asset_id="$(node - "$assets_json" "$asset" <<'NODE'
          const fs = require("node:fs");
          const [jsonFile, assetName] = process.argv.slice(2);
          const assets = JSON.parse(fs.readFileSync(jsonFile, "utf8"));
          const match = assets.find(asset => asset.name === assetName);
          if (match) process.stdout.write(String(match.id));
          NODE
            )"
            if [ -n "$existing_asset_id" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset_id}" >/dev/null
            fi

            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset}" \
              >/dev/null
            echo "Uploaded ${asset}"
          done
