name: Fork Release

on:
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate fork release inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      official_tag: ${{ steps.metadata.outputs.official_tag }}
      official_sha: ${{ steps.metadata.outputs.official_sha }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify official baseline and native source gate
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Fork releases must be dispatched from main, not $GITHUB_REF"
            exit 1
          fi

          manifest=".github/fork-release-native-manifest.json"
          version="$(node -p "require('./${manifest}').source.version")"
          official_tag="$(node -p "require('./${manifest}').source.officialTag")"
          locked_official_sha="$(node -p "require('./${manifest}').source.officialSha")"
          release_tag="v${version}-fork.${GITHUB_RUN_NUMBER}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Locked source version must be an exact stable version, got: $version"
            exit 1
          fi
          coding_agent_version="$(node -p "require('./packages/coding-agent/package.json').version")"
          native_core_version="$(node -p "require('./packages/natives/package.json').version")"
          if [ "$coding_agent_version" != "$version" ] || [ "$native_core_version" != "$version" ]; then
            echo "::error::Source/native versions must both equal the locked official version $version (coding-agent=$coding_agent_version, natives=$native_core_version)"
            exit 1
          fi
          if [ "$official_tag" != "v${version}" ]; then
            echo "::error::Locked official tag $official_tag does not match source version $version"
            exit 1
          fi

          git remote add official https://github.com/can1357/oh-my-pi.git
          git fetch --no-tags official "+refs/tags/${official_tag}:refs/tags/fork-official-${official_tag}"
          official_sha="$(git rev-list -n1 "refs/tags/fork-official-${official_tag}")"
          if [ "$official_sha" != "$locked_official_sha" ]; then
            echo "::error::Official tag ${official_tag} resolved to ${official_sha}; locked baseline is ${locked_official_sha}"
            exit 1
          fi
          merge_base="$(git merge-base "$official_sha" "$GITHUB_SHA")"
          if [ "$merge_base" != "$official_sha" ]; then
            echo "::error::Current main is not based directly on official ${official_tag} (${official_sha}); merge base is ${merge_base}"
            exit 1
          fi

          native_paths=(
            crates/
            bazel/
            packages/natives/
            Cargo.toml
            Cargo.lock
            MODULE.bazel
            MODULE.bazel.lock
            BUILD.bazel
            .bazelrc
            .bazelignore
            .bazelversion
            rust-toolchain.toml
            rustfmt.toml
          )
          mapfile -t native_changes < <(git diff --name-only "${official_sha}...${GITHUB_SHA}" -- "${native_paths[@]}")
          if [ "${#native_changes[@]}" -ne 0 ]; then
            printf '::error::Fork release is forbidden because native source/build inputs differ from %s:\n' "$official_tag"
            printf ' - %s\n' "${native_changes[@]}"
            exit 1
          fi

          latest_refs="$(git grep -nE '@oh-my-pi/pi-natives-(linux-x64|linux-arm64|win32-x64)@latest' -- .github || true)"
          if [ -n "$latest_refs" ]; then
            echo "::error::Floating native package references are forbidden"
            printf '%s\n' "$latest_refs"
            exit 1
          fi

          {
            echo "version=$version"
            echo "official_tag=$official_tag"
            echo "official_sha=$official_sha"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Official source: ${official_tag} (${official_sha})"
          echo "Fork release: ${release_tag} (${GITHUB_SHA})"

      - name: Verify every locked official native package
        shell: bash
        run: |
          set -euo pipefail
          for target in linux-x64 linux-arm64 win32-x64; do
            bash .github/scripts/fork-release-native.sh "$target" "$RUNNER_TEMP/native-$target"
          done

  build-x64:
    name: Build Linux + Windows x64
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Install locked Linux and Windows x64 native addons
        shell: bash
        run: |
          set -euo pipefail
          native_dir="packages/natives/native"
          rm -f "$native_dir"/pi_natives.*.node "$native_dir"/embedded-addons.*.tar.gz
          bash .github/scripts/fork-release-native.sh linux-x64 "$native_dir"
          bash .github/scripts/fork-release-native.sh win32-x64 "$native_dir"

      - name: Build both x64 targets with one shared bundle
        env:
          RELEASE_TARGETS: linux-x64,win32-x64
        run: bun run ci:release:build-binaries

      - name: Verify and smoke-test Linux x64
        shell: bash
        run: |
          set -euo pipefail
          linux_binary="$PWD/packages/coding-agent/binaries/omp-linux-x64"
          windows_binary="$PWD/packages/coding-agent/binaries/omp-windows-x64.exe"
          test -s "$linux_binary"
          test -s "$windows_binary"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$linux_binary" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$linux_binary" --smoke-test

      - name: Upload x64 binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-binaries-x64
          path: |
            packages/coding-agent/binaries/omp-linux-x64
            packages/coding-agent/binaries/omp-windows-x64.exe
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: Build Linux ARM64
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Install locked Linux ARM64 native addon
        shell: bash
        run: |
          set -euo pipefail
          native_dir="packages/natives/native"
          rm -f "$native_dir"/pi_natives.*.node "$native_dir"/embedded-addons.*.tar.gz
          bash .github/scripts/fork-release-native.sh linux-arm64 "$native_dir"

      - name: Build Linux ARM64 target
        env:
          RELEASE_TARGETS: linux-arm64
        run: bun run ci:release:build-binaries

      - name: Verify on a real ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          binary="$PWD/packages/coding-agent/binaries/omp-linux-arm64"
          test -s "$binary"
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --smoke-test

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-binaries-arm64
          path: packages/coding-agent/binaries/omp-linux-arm64
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish fork release
    needs: [validate, build-x64, build-arm64]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: omp-binaries-*
          path: release
          merge-multiple: true

      - name: Verify exact asset set and generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-assets.txt"
          actual="$RUNNER_TEMP/actual-assets.txt"
          printf '%s\n' \
            omp-linux-arm64 \
            omp-linux-x64 \
            omp-windows-x64.exe | sort > "$expected"
          find release -maxdepth 1 -type f -printf '%f\n' | sort > "$actual"
          if ! diff -u "$expected" "$actual"; then
            echo "::error::Release artifact set is not exactly the three supported binaries"
            exit 1
          fi
          for file in omp-linux-x64 omp-linux-arm64 omp-windows-x64.exe; do
            test -s "release/$file"
          done
          (
            cd release
            sha256sum omp-linux-x64 omp-linux-arm64 omp-windows-x64.exe > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Create or verify release tag through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Existing tag ${RELEASE_TAG} points to ${existing_sha}, not ${GITHUB_SHA}"
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already points to the expected commit."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          OFFICIAL_TAG: ${{ needs.validate.outputs.official_tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Downstream fork package based on official \`${OFFICIAL_TAG}\`.

          Assets are intentionally limited to Linux x64, Linux ARM64, Windows x64, and \`SHA256SUMS.txt\`. Native addons are the locked official \`${VERSION}\` npm artifacts and this workflow does not compile Rust.

          The fork defaults \`hub.mode\` to \`compact\`; set it to \`full\` to restore the upstream Hub model surface without rebuilding. The upstream Hub/IRC runtime remains intact.
          EOF
          title="OMP ${VERSION} fork build ${GITHUB_RUN_NUMBER}"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            release_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$title" \
              -f body="$(cat "$notes")" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true \
              --jq '.id')"
          else
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="$title" \
              -f body="$(cat "$notes")" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true >/dev/null
          fi
          gh release upload "$RELEASE_TAG" \
            release/omp-linux-x64 \
            release/omp-linux-arm64 \
            release/omp-windows-x64.exe \
            release/SHA256SUMS.txt \
            --clobber
