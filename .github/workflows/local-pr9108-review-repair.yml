name: Local PR 9108 review repair

on:
  pull_request:
    branches:
      - feat/omp-subagent-runtime-model-identity
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/pr9108-review-findings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr9108-review-findings
          fetch-depth: 0

      - name: Check repair request marker
        id: marker
        shell: bash
        run: |
          if [[ -f LOCAL-PR9108-REPAIR-REQUEST ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.marker.outputs.run == 'true'
        with:
          bun-version: 1.3.14

      - name: Apply exact review fixes
        if: steps.marker.outputs.run == 'true'
        run: python3 scripts/local-pr9108-review-repair.py

      - name: Install dependencies
        if: steps.marker.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Fetch release native addons
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          mkdir -p packages/natives/native
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
          cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
          for (const f of process.argv.slice(2)) {
            const m = require(f);
            if (!m || Object.keys(m).length === 0) process.exit(1);
          }
          EOF
          bun "$RUNNER_TEMP/smoke-addons.js" \
            "$PWD/packages/natives/native/pi_natives.linux-x64-baseline.node" \
            "$PWD/packages/natives/native/pi_natives.linux-x64-modern.node"

      - name: Run targeted regression tests
        if: steps.marker.outputs.run == 'true'
        run: |
          bun test \
            packages/coding-agent/test/pr9108-review-regressions.test.ts \
            packages/coding-agent/test/runtime-model-identity.test.ts \
            packages/coding-agent/test/task-routing-integration.test.ts

      - name: Run TypeScript checks
        if: steps.marker.outputs.run == 'true'
        run: bun run check:ts

      - name: Commit verified local repair
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f LOCAL-PR9108-REPAIR-REQUEST scripts/local-pr9108-review-repair.py
          git config user.name "cp7-local-review-repair"
          git config user.email "actions@users.noreply.github.com"
          git add packages/coding-agent/src/config/settings-schema.ts \
                  packages/coding-agent/src/task/index.ts \
                  packages/coding-agent/src/task/executor.ts \
                  packages/coding-agent/test/task-routing-integration.test.ts \
                  packages/coding-agent/test/pr9108-review-regressions.test.ts \
                  LOCAL-PR9108-REPAIR-REQUEST \
                  scripts/local-pr9108-review-repair.py
          git diff --cached --check
          git commit -m "fix(task): address PR 9108 review blockers"
          git push origin HEAD:fix/pr9108-review-findings
