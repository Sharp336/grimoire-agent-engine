name: Temporary Command Code changelog patch

on:
  push:
    branches:
      - feat/command-code-provider-api

permissions:
  contents: write

jobs:
  patch-changelogs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/command-code-provider-api
          fetch-depth: 0

      - name: Patch Unreleased changelog entries
        shell: python
        run: |
          from pathlib import Path

          entries = {
              Path("packages/ai/CHANGELOG.md"): (
                  "### Added\n\n"
                  "- Added Command Code API-key login with authenticated Provider API model validation and mixed-wire request routing.\n\n"
              ),
              Path("packages/catalog/CHANGELOG.md"): (
                  "### Added\n\n"
                  "- Added Command Code as a mixed-wire provider with authenticated model discovery and per-model Anthropic Messages/OpenAI Chat Completions routing.\n\n"
              ),
          }

          marker = "## [Unreleased]\n\n"
          for path, entry in entries.items():
              text = path.read_text(encoding="utf-8")
              head, sep, tail = text.partition("\n## [18.")
              if not sep:
                  raise SystemExit(f"Could not locate first release section in {path}")
              if "Command Code" in head:
                  print(f"{path}: entry already present")
                  continue
              if marker not in text:
                  raise SystemExit(f"Could not locate Unreleased marker in {path}")
              path.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")
              print(f"{path}: patched")

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- packages/ai/CHANGELOG.md packages/catalog/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/CHANGELOG.md packages/catalog/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes needed"
            exit 0
          fi
          git commit -m "docs: add Command Code changelog entries"
          git push origin HEAD:feat/command-code-provider-api
