name: ChatGPT Web release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish native leaves and attach launcher artifacts"
        type: boolean
        default: false
      release_tag:
        description: "Existing v* tag to publish on a manual run"
        type: string
        default: ""

concurrency:
  group: chatgpt-web-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/chatgpt-web-chromium
  CHATGPT_WEB_TEST_CHROMIUM_VERSION: playwright-core-1.62.1
  CHATGPT_WEB_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  validate:
    name: Package and license gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/bun-install
      - name: Verify release tag and package versions
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          version="$(bun -p 'require("./package.json").workspaces.catalog["@oh-my-pi/pi-coding-agent"]')"
          test "$(bun -p 'require("./packages/chatgpt-web/package.json").version')" = "$version"
          test "$(bun -p 'require("./packages/chatgpt-web-launcher/package.json").version')" = "$version"
          if test "$PUBLISH_REQUESTED" = true; then
            test "$CHATGPT_WEB_RELEASE_TAG" = "v$version"
          fi
      - name: Verify notices and runtime dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s packages/chatgpt-web/LICENSES/NOTICE.md
          test -s packages/chatgpt-web/LICENSES/OpenCodex-MIT.txt
          for dependency in '@modelcontextprotocol/sdk' fflate playwright-core turndown turndown-plugin-gfm zod motion react react-dom electron; do
            grep -Fq "$dependency" packages/chatgpt-web/LICENSES/NOTICE.md
          done
          test -s packages/chatgpt-web/LICENSES/Bun-runtime.md
          grep -Fq 'Bun 1.3.14' packages/chatgpt-web/LICENSES/Bun-runtime.md
      - name: Type check provider and launcher packages
        run: |
          bun run chatgpt-web:check
          bun run chatgpt-web-launcher:check

  native:
    name: Native ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x64
            runner: ubuntu-22.04
            targets: linux-x64-baseline linux-x64-modern
          - artifact: linux-arm64
            runner: ubuntu-24.04-arm
            targets: linux-arm64
          - artifact: stage-linux-musl-x64
            runner: ubuntu-22.04
            targets: linux-musl-x64-baseline
          - artifact: stage-linux-musl-arm64
            runner: ubuntu-24.04-arm
            targets: linux-musl-arm64
          - artifact: darwin-x64
            runner: macos-15-intel
            targets: darwin-x64-baseline
          - artifact: darwin-arm64
            runner: macos-15
            targets: darwin-arm64
          - artifact: win32-x64
            runner: ubuntu-22.04
            targets: win32-x64-baseline
          - artifact: win32-arm64
            runner: ubuntu-22.04
            targets: win32-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/bun-install
      - name: Build exact target addon
        uses: ./.github/actions/bazel-natives
        with:
          targets: ${{ matrix.targets }}
          dest: release-native/${{ matrix.artifact }}
          cache-scope: chatgpt-web-release-${{ matrix.artifact }}
      - name: Verify generated ABI, hash, loader, and leaf contracts
        run: |
          bun --cwd=packages/natives run build:bindings
          bun test scripts/bazel-natives.test.ts
          bun test packages/natives/test/native-loader-metadata.test.ts packages/natives/test/npm-packages.test.ts
      - name: Upload exact native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatgpt-native-${{ matrix.artifact }}
          path: release-native/${{ matrix.artifact }}/*.node
          if-no-files-found: error
          retention-days: 7

  launcher:
    name: Launcher ${{ matrix.tag }}
    needs: [validate, native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: linux-x64
            runner: ubuntu-22.04
          - tag: linux-arm64
            runner: ubuntu-24.04-arm
          - tag: darwin-x64
            runner: macos-15-intel
          - tag: darwin-arm64
            runner: macos-15
          - tag: win32-x64
            runner: windows-2022
          - tag: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/bun-install
      - name: Install exact target addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chatgpt-native-${{ matrix.tag }}
          path: packages/natives/native
      - name: Generate exact target native leaf
        run: bun --cwd=packages/natives run gen:npm -- --tag "${{ matrix.tag }}"
      - name: Verify target loader metadata
        run: bun test packages/natives/test/native-loader-metadata.test.ts packages/natives/test/local-peer.test.ts
      - name: Install pinned Chromium artifact
        run: bun x playwright-core install chromium
      - name: Export Chromium executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CHATGPT_WEB_TEST_CHROMIUM=$(bun -e 'import { chromium } from \"playwright-core\"; process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Export Chromium executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CHATGPT_WEB_TEST_CHROMIUM=$(bun -e ''import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())'')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Verify native browser transport
        run: bun test packages/chatgpt-web/test/native-browser-transport.integration.test.ts
      - name: Run account-free provider fixtures
        run: bun run chatgpt-web:test
      - name: Check, build, test, and package launcher
        run: |
          bun run chatgpt-web-launcher:check
          bun run chatgpt-web-launcher:build
          bun run chatgpt-web-launcher:test
          bun run chatgpt-web-launcher:build-runtime
          bun run chatgpt-web-launcher:package
          bun run chatgpt-web-launcher:smoke-package
      - name: Upload launcher package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatgpt-launcher-${{ matrix.tag }}
          path: packages/chatgpt-web-launcher/release/**
          if-no-files-found: error
          retention-days: 7

  publish_native_leaf:
    name: Publish native leaf ${{ matrix.tag }}
    if: github.event_name == 'push' || inputs.publish
    needs: [validate, native, launcher]
    strategy:
      fail-fast: false
      matrix:
        tag: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64, win32-arm64]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/bun-install
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install exact leaf artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chatgpt-native-${{ matrix.tag }}
          path: packages/natives/native
      - name: Generate and verify one leaf manifest
        shell: bash
        run: |
          set -euo pipefail
          bun --cwd=packages/natives run gen:npm -- --tag "${{ matrix.tag }}"
          test -s "packages/natives/npm/${{ matrix.tag }}/package.json"
          test "$(bun -p 'require("./packages/natives/npm/${{ matrix.tag }}/package.json").ompNative.platformTag')" = "${{ matrix.tag }}"
          bun test packages/natives/test/native-loader-metadata.test.ts packages/natives/test/npm-packages.test.ts
      - name: Publish exact native leaf
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run ci:release:publish-native-leaf "${{ matrix.tag }}"

  publish_launcher:
    name: Attach launcher artifacts
    if: github.event_name == 'push' || inputs.publish
    needs: [validate, native, launcher, publish_native_leaf]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download launcher artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chatgpt-launcher-*
          path: release-assets
          merge-multiple: true
      - name: Add separate project notices
        run: |
          cp LICENSE release-assets/OMP-LICENSE
          cp packages/chatgpt-web/LICENSES/NOTICE.md release-assets/NOTICE.md
          cp packages/chatgpt-web/LICENSES/OpenCodex-MIT.txt release-assets/OpenCodex-MIT.txt
          if test -e packages/chatgpt-web/LICENSES/Bun-runtime.md; then
            cp packages/chatgpt-web/LICENSES/Bun-runtime.md release-assets/Bun-runtime.md
          fi
      - name: Attach verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0)
          test "${#files[@]}" -gt 3
          if gh release view "$CHATGPT_WEB_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$CHATGPT_WEB_RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$CHATGPT_WEB_RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "$CHATGPT_WEB_RELEASE_TAG" --generate-notes
          fi
