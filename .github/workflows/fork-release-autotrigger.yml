name: Fork Release Auto Trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fork-release-autotrigger.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch Fork Release on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/fork-release.yml/dispatches" \
            -f ref=main
