name: Fork Release Auto Trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fork-release.yml
      - .github/workflows/fork-release-autotrigger.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch and track Fork Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          before_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/fork-release.yml/runs?event=workflow_dispatch&branch=main&per_page=1" \
            --jq '.workflow_runs[0].id // 0')"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/fork-release.yml/dispatches" \
            -f ref=main

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/fork-release.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
              --jq ".workflow_runs[] | select(.id != ${before_id} and .head_sha == \"${GITHUB_SHA}\") | .id" | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "::error::Could not find the dispatched Fork Release run for ${GITHUB_SHA}"
            exit 1
          fi

          status=""
          conclusion=""
          html_url=""
          for _ in $(seq 1 300); do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            html_url="$(jq -r '.html_url' <<<"$run_json")"
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 5
          done

          if [ "$status" != "completed" ]; then
            conclusion="timed_out_tracking"
          fi

          status_json="$(jq -n \
            --arg run_id "$run_id" \
            --arg sha "$GITHUB_SHA" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --arg html_url "$html_url" \
            '{run_id: ($run_id|tonumber), sha: $sha, status: $status, conclusion: $conclusion, html_url: $html_url}')"
          encoded="$(printf '%s\n' "$status_json" | base64 -w0)"
          status_path=".github/fork-release-status.json"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${status_path}?ref=main" --jq '.sha' 2>/dev/null || true)"

          args=(
            --method PUT
            "repos/${GITHUB_REPOSITORY}/contents/${status_path}"
            -f message="ci: record fork release run ${run_id}"
            -f content="$encoded"
            -f branch=main
          )
          if [ -n "$existing_sha" ]; then
            args+=( -f sha="$existing_sha" )
          fi
          gh api "${args[@]}" >/dev/null

          echo "Tracked Fork Release run: ${html_url} (${conclusion})"
