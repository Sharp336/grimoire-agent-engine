syntax = "proto3";

message Person {
  string name = 1;
  int32 age = 2;
  Address address = 3;
}

message Address {
  string street = 1;
  string city = 2;
}

enum Status {
  UNKNOWN = 0;
  ACTIVE = 1;
}

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
  rpc StreamGreetings(HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
